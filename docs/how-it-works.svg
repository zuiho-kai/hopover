<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .inner { fill: #f3f6fa; stroke: #d0d7de; }
    .accent { fill: #e8f1ff; stroke: #2f80ed; }
    .h { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .t { font-size: 14px; fill: #1f2328; }
    .s { font-size: 12px; fill: #59636e; }
    .wire { stroke: #2f80ed; stroke-width: 2.5; fill: none; }
    .wire2 { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .wire3 { stroke: #8c959f; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .lbl { font-size: 13px; fill: #1f2328; }
    .lbls { font-size: 11.5px; fill: #59636e; }
    .bg { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #3d444d; }
      .inner { fill: #0d1117; stroke: #3d444d; }
      .accent { fill: #0c2d6b; stroke: #4493f8; }
      .h, .t, .lbl { fill: #e6edf3; }
      .s, .lbls { fill: #9198a1; }
      .wire { stroke: #4493f8; }
      .wire2 { stroke: #3fb950; }
      .bg { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="360" rx="16"/>

  <!-- Mac -->
  <rect class="card" x="24" y="24" width="300" height="312" rx="14"/>
  <text class="h" x="44" y="58">Mac</text>
  <text class="s" x="98" y="58">键盘鼠标接在这台</text>
  <rect class="accent" x="44" y="80" width="260" height="70" rx="10"/>
  <text class="t" x="60" y="108">Hopover（菜单栏）</text>
  <text class="s" x="60" y="130">开关跨屏 · 投放面板 · 收件卡片</text>
  <rect class="inner" x="44" y="166" width="260" height="70" rx="10"/>
  <text class="t" x="60" y="194">Deskflow server</text>
  <text class="s" x="60" y="216">捕获键鼠，按屏幕边缘切换</text>
  <rect class="inner" x="44" y="252" width="260" height="64" rx="10"/>
  <text class="t" x="60" y="278">无缝拖拽注入</text>
  <text class="s" x="60" y="298">在对面松手前替你「拿住」文件</text>

  <!-- Windows -->
  <rect class="card" x="636" y="24" width="300" height="312" rx="14"/>
  <text class="h" x="656" y="58">Windows</text>
  <rect class="accent" x="656" y="80" width="260" height="70" rx="10"/>
  <text class="t" x="672" y="108">Hopover（托盘）</text>
  <text class="s" x="672" y="130">配对窗口 · 投放面板 · 收件卡片</text>
  <rect class="inner" x="656" y="166" width="260" height="70" rx="10"/>
  <text class="t" x="672" y="194">Deskflow client</text>
  <text class="s" x="672" y="216">把键鼠事件注入 Windows</text>
  <rect class="inner" x="656" y="252" width="260" height="64" rx="10"/>
  <text class="t" x="672" y="278">管理员帮手（可选）</text>
  <text class="s" x="672" y="298">让鼠标也能操作管理员窗口</text>

  <!-- wires -->
  <path class="wire" d="M304 201 L656 201"/>
  <text class="lbl" x="480" y="190" text-anchor="middle">键盘鼠标</text>
  <text class="lbls" x="480" y="222" text-anchor="middle">TCP 24800 · TLS，双方互相校验证书指纹</text>

  <path class="wire2" d="M304 115 L656 115"/>
  <text class="lbl" x="480" y="104" text-anchor="middle">文件</text>
  <text class="lbls" x="480" y="136" text-anchor="middle">TCP 47820 · 配对时派生的 token 校验</text>

  <path class="wire3" d="M656 284 L304 284" marker-end="url(#a)"/>
  <text class="lbl" x="480" y="273" text-anchor="middle">自动发现（仅配对时）</text>
  <text class="lbls" x="480" y="305" text-anchor="middle">UDP 47821 · ECDH + 6 位数字比对</text>
</svg>
